name: '🧪 Run tests'

on:
  workflow_call:
    inputs:
      ref:
        description: 'Ref to run on'
        type: string
        required: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none

      - name: 'Validate composer.json'
        run: composer validate --no-check-publish --no-check-lock

      - name: 'Check PHP syntax'
        shell: bash
        #language=bash
        run: |
          git ls-files -z '*.php' | xargs -0 -n 1 php -l -d display_errors=stderr > /dev/null
